	/* Pagination config */
	const PER_PAGE = 10;

	/* ============================================================
	STATE
	============================================================ */
	let currentFilter = 'all';
	let currentPage = 1;
	let visibleItems = []; // items filtered (used for lightbox navigation)
	let lightboxIndex = 0;

	/* ============================================================
	DOM
	============================================================ */
	const grid             = document.getElementById('grid');
	const filtersWrap      = document.getElementById('filters');
	const prevBtn          = document.getElementById('prev');
	const nextBtn          = document.getElementById('next');
	const currentPageEl    = document.getElementById('currentPage');
	const totalPagesEl     = document.getElementById('totalPages');

	const lightbox         = document.getElementById('lightbox');
	const lightboxImg      = document.getElementById('lightboxImg');
	const lightboxClose    = document.getElementById('lightboxClose');
	const lightboxPrev     = document.getElementById('lightboxPrev');
	const lightboxNext     = document.getElementById('lightboxNext');
	const metaTitle        = document.getElementById('metaTitle');
	const metaPhotographer = document.getElementById('metaPhotographer');
	const metaDescription  = document.getElementById('metaDescription');
	const metaCategories   = document.getElementById('metaCategories');
	const metaIndex        = document.getElementById('metaIndex');
	const metaTotal        = document.getElementById('metaTotal');

	/* ============================================================
	FILTER COUNTS
	============================================================ */
	function updateFilterCounts() {
		const buttons = filtersWrap.querySelectorAll('.gallery-filter');
		buttons.forEach(btn => {
			const f = btn.dataset.filter;
			const count = f === 'all'
				? ITEMS.length
				: ITEMS.filter(i => i.category === f).length;
			btn.querySelector('.count').textContent = `(${count})`;
		});
	}

	/* ============================================================
	RENDER GRID
	============================================================ */
	function getFilteredItems() {
		if (currentFilter === 'all') return ITEMS;
		return ITEMS.filter(i => i.category === currentFilter);
	}

	function renderGrid() {
		const filtered = getFilteredItems();
		const totalPages = Math.max(1, Math.ceil(filtered.length / PER_PAGE));
		if (currentPage > totalPages) currentPage = totalPages;

		const start = (currentPage - 1) * PER_PAGE;
		const end   = start + PER_PAGE;
		const pageItems = filtered.slice(start, end);

		visibleItems = pageItems;

		grid.innerHTML = '';

		pageItems.forEach((item, i) => {
			const el = document.createElement('div');
			el.className = `gallery-item ${item.span || ''}`.trim();
			el.dataset.id = item.id;
			el.dataset.index = i;
			el.tabIndex = 0;
			el.setAttribute('role', 'button');
			el.setAttribute('aria-label', `Open ${item.title}`);

			el.innerHTML = `
				<span class="index">${String(start + i + 1).padStart(2, '0')}</span>
				<img src="${item.src}" alt="${item.title}" loading="lazy" />
				${item.photographer
					? `<span class="photographer">${item.photographer}</span>`
					: ''}
			`;

			// Stagger delay
			el.style.transitionDelay = `${(i % 6) * 60}ms`;

			grid.appendChild(el);
		});

		// Update pagination UI
		currentPageEl.textContent = String(currentPage).padStart(2, '0');
		totalPagesEl.textContent  = String(totalPages).padStart(2, '0');
		prevBtn.disabled = currentPage <= 1;
		nextBtn.disabled = currentPage >= totalPages;

		// Observe for reveal
		observeItems();
	}

	/* ============================================================
	INTERSECTION OBSERVER — reveal
	============================================================ */
	let observer;
	function observeItems() {
		if (observer) observer.disconnect();

		observer = new IntersectionObserver((entries) => {
			entries.forEach(entry => {
				if (entry.isIntersecting) {
					entry.target.classList.add('is-visible');
					observer.unobserve(entry.target);
				}
			});
		}, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });

		grid.querySelectorAll('.gallery-item').forEach(el => observer.observe(el));
	}

	/* ============================================================
	FILTERS
	============================================================ */
	filtersWrap.addEventListener('click', (e) => {
		const btn = e.target.closest('.gallery-filter');
		if (!btn) return;

		filtersWrap.querySelectorAll('.gallery-filter').forEach(b => b.classList.remove('active'));
		btn.classList.add('active');

		currentFilter = btn.dataset.filter;
		currentPage = 1;
		renderGrid();
	});

	/* ============================================================
	PAGINATION
	============================================================ */
	prevBtn.addEventListener('click', () => {
		if (currentPage > 1) { currentPage--; renderGrid(); scrollToGallery(); }
	});
	nextBtn.addEventListener('click', () => {
		const total = Math.max(1, Math.ceil(getFilteredItems().length / PER_PAGE));
		if (currentPage < total) { currentPage++; renderGrid(); scrollToGallery(); }
	});

	function scrollToGallery() {
		const top = document.getElementById('gallery').offsetTop - 40;
		window.scrollTo({ top, behavior: 'smooth' });
	}

	/* ============================================================
	LIGHTBOX
	============================================================ */
	grid.addEventListener('click', (e) => {
		const item = e.target.closest('.gallery-item');
		if (!item) return;
		openLightbox(parseInt(item.dataset.index, 10));
	});

	grid.addEventListener('keydown', (e) => {
		if (e.key !== 'Enter' && e.key !== ' ') return;
		const item = e.target.closest('.gallery-item');
		if (!item) return;
		e.preventDefault();
		openLightbox(parseInt(item.dataset.index, 10));
	});

	function openLightbox(index) {
		lightboxIndex = index;
		updateLightboxContent();
		lightbox.classList.add('active');
		document.body.style.overflow = 'hidden';
	}

	function closeLightbox() {
		lightbox.classList.remove('active');
		document.body.style.overflow = '';
	}

	function updateLightboxContent() {
		const item = visibleItems[lightboxIndex];
		if (!item) return;

		// Fade image
		lightboxImg.classList.add('loading');
		const newImg = new Image();
		newImg.src = item.src;
		newImg.onload = () => {
			lightboxImg.src = item.src;
			lightboxImg.alt = item.title;
			lightboxImg.classList.remove('loading');
		};

		metaTitle.textContent        = item.title;
		metaPhotographer.textContent = item.photographer;
		metaDescription.textContent  = item.description;
		metaCategories.innerHTML     = `<span>${item.category}</span>`;
		metaIndex.textContent        = String(lightboxIndex + 1).padStart(2, '0');
		metaTotal.textContent        = String(visibleItems.length).padStart(2, '0');
	}

	function nextImage() {
		if (visibleItems.length < 2) return;
		lightboxIndex = (lightboxIndex + 1) % visibleItems.length;
		updateLightboxContent();
	}

	function prevImage() {
		if (visibleItems.length < 2) return;
		lightboxIndex = (lightboxIndex - 1 + visibleItems.length) % visibleItems.length;
		updateLightboxContent();
	}

	lightboxClose.addEventListener('click', closeLightbox);
	lightboxNext.addEventListener('click', nextImage);
	lightboxPrev.addEventListener('click', prevImage);

	// Click backdrop to close
	lightbox.addEventListener('click', (e) => {
		if (e.target === lightbox) closeLightbox();
	});

	// Keyboard
	document.addEventListener('keydown', (e) => {
		if (!lightbox.classList.contains('active')) return;
		if (e.key === 'Escape')     closeLightbox();
		if (e.key === 'ArrowRight') nextImage();
		if (e.key === 'ArrowLeft')  prevImage();
	});

	// Swipe support
	let touchStartX = 0;
	lightbox.addEventListener('touchstart', (e) => {
		touchStartX = e.changedTouches[0].screenX;
	}, { passive: true });

	lightbox.addEventListener('touchend', (e) => {
		const diff = e.changedTouches[0].screenX - touchStartX;
		if (Math.abs(diff) > 60) {
			diff > 0 ? prevImage() : nextImage();
		}
	}, { passive: true });

	/* ============================================================
	INIT
	============================================================ */
	updateFilterCounts();
	renderGrid();



</script>
