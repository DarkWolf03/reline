    <script>


        // =============== AUDIO ON INDEX ===============
        (function() {
            const video = document.getElementById('bgVideo');
            const toggleBtn = document.getElementById('musicToggle');
            const musicIcon = document.getElementById('musicIcon');
            const musicLabel = document.getElementById('musicLabel');

            // Initially: video is muted (off) – matches the muted attribute
            let isMuted = true;

            // Ensure the video is muted on load (double-check)
            video.muted = true;

            // Update button UI according to state
            function updateButtonUI() {
                if (isMuted) {
                // Music is OFF (muted)
                musicIcon.className = 'fas fa-volume-mute';

                toggleBtn.setAttribute('aria-label', 'turn music on');
                } else {
                // Music is ON (unmuted)
                musicIcon.className = 'fas fa-volume-up';
                toggleBtn.setAttribute('aria-label', 'turn music off');
                }
            }

            // Initial UI sync
            updateButtonUI();

            // Toggle function
            function toggleMute() {
                // Toggle the muted state
                isMuted = !isMuted;
                video.muted = isMuted;

                // If we are un-muting, we may need to "wake" the video for some browsers
                // (video is already playing because of autoplay + muted policy)
                if (!isMuted) {
                // Some browsers require video.play() after un-muting to keep playing
                // Especially when unmuting from a user gesture. But we're in a click handler, so fine.
                // Just make sure it's still playing.
                if (video.paused) {
                    video.play().catch(err => {
                    // If autoplay fails, we keep muted? Better to revert? Let's handle gracefully.
                    console.warn('Playback was blocked after unmuting:', err);
                    // revert to muted state if play fails? (rare, but possible)
                    // But we want to keep UI in sync. We'll revert.
                    isMuted = true;
                    video.muted = true;
                    updateButtonUI();
                    });
                }
                }

                // Update the button UI
                updateButtonUI();
            }

            // Add click listener to the button
            toggleBtn.addEventListener('click', toggleMute);

            // Because the video is muted by default, we also want to ensure it plays
            // (browsers allow muted autoplay). But if something prevented it, try again.
            window.addEventListener('load', function() {
                // If video is paused (rare), force play (muted)
                if (video.paused) {
                video.play().catch(e => console.warn('autoplay was prevented:', e));
                }
                // Double-check muted state
                video.muted = true;
                isMuted = true;
                updateButtonUI();
            });

            // Some browsers might fire 'volumechange' (if user uses native controls) – not needed here.
            // But if someone changes volume externally, we want to stay in sync.
            video.addEventListener('volumechange', function() {
                // If the video becomes unmuted externally, we update state.
                // But we only care if the muted property changed.
                if (video.muted !== isMuted) {
                isMuted = video.muted;
                updateButtonUI();
                }
            });
            })();
    </script>
